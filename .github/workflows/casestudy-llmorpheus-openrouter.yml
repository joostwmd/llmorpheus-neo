          #   file: "lib/yargs-factory.ts"
          #   lines: "1049"
    timeout-minutes: 720

    steps:
      - name: Respect matrix_filter (skip job when substring does not match this row)
        id: row
        run: |
          FILTER="$(echo '${{ inputs.matrix_filter }}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          ROW="${{ matrix.bug }},${{ matrix.repo }},${{ matrix.file }}"
          if [[ -z "$FILTER" ]] || [[ "$ROW" == *"$FILTER"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping row (matrix_filter does not match): ${{ matrix.bug }}"
          fi

      - name: Checkout this repository (LLMorpheus + thesis metadata)
        if: ${{ steps.row.outputs.run == 'true' }}
        uses: actions/checkout@v4

      - name: Checkout StrykerJS (neu-se/stryker-js)
        if: ${{ steps.row.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: neu-se/stryker-js
          ref: master
          path: stryker-js

      - name: Build StrykerJS
        if: ${{ steps.row.outputs.run == 'true' }}
        run: |
          cd stryker-js
          npm install
          npm run build

      - name: Build LLMorpheus
        if: ${{ steps.row.outputs.run == 'true' }}
        run: |
          cd source/llmorpheus
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Checkout subject repository
        if: ${{ steps.row.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: subjects/${{ matrix.bug }}
          fetch-depth: 0

      - name: Checkout subject at matrix commit SHA
        if: ${{ steps.row.outputs.run == 'true' }}
        working-directory: subjects/${{ matrix.bug }}
        run: |
          echo "Checking out commit: ${{ matrix.commit }}"
          git checkout ${{ matrix.commit }}
          git log -1 --oneline

      - name: Patch TypeScript helper (yargs-2171 only)
        if: ${{ steps.row.outputs.run == 'true' && matrix.bug == 'yargs-2171' }}
        working-directory: subjects/${{ matrix.bug }}
        run: |
          FILE="lib/typings/common-types.ts"
          if [[ ! -f "$FILE" ]]; then
            echo "::error::Expected $FILE after checkout"
            exit 1
          fi
          sed -i 's/export function objectKeys<T>(object: T)/export function objectKeys<T extends Object>(object: T)/' "$FILE"

      - name: Detect package manager (subject)
        if: ${{ steps.row.outputs.run == 'true' }}
        id: lockfile
        working-directory: subjects/${{ matrix.bug }}
        run: |
          if [[ -f package-lock.json ]] || [[ -f npm-shrinkwrap.json ]]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js (yarn cache)
        if: ${{ steps.row.outputs.run == 'true' && steps.lockfile.outputs.pm == 'yarn' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: subjects/${{ matrix.bug }}/yarn.lock

      - name: Setup Node.js (npm cache)
        if: ${{ steps.row.outputs.run == 'true' && steps.lockfile.outputs.pm == 'npm' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: subjects/${{ matrix.bug }}/package-lock.json

      - name: Setup Node.js (no lockfile — no dependency cache)
        if: steps.lockfile.outputs.pm == 'none'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install subject dependencies
        if: ${{ steps.row.outputs.run == 'true' }}
        working-directory: subjects/${{ matrix.bug }}
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_PROGRESS: "false"
          PHANTOMJS_SKIP_DOWNLOAD: "true"
        run: |
          echo "Installing dependencies for ${{ matrix.bug }}..."
          INSTALL_TIMEOUT_SEC="${INSTALL_TIMEOUT_SEC:-1200}"

          npm_install() {
            timeout "${INSTALL_TIMEOUT_SEC}" npm install --legacy-peer-deps --no-audit --no-fund --loglevel=warn "$@" \
              || timeout "${INSTALL_TIMEOUT_SEC}" npm install --no-audit --no-fund --loglevel=warn "$@"
          }

          npm_ci() {
            timeout "${INSTALL_TIMEOUT_SEC}" npm ci --legacy-peer-deps --no-audit --no-fund \
              || timeout "${INSTALL_TIMEOUT_SEC}" npm ci --no-audit --no-fund \
              || npm_install
          }

          if [[ -f package-lock.json ]]; then
            echo "Using npm ci..."
            npm_ci
          elif [[ -f yarn.lock ]]; then
            echo "Using yarn..."
            timeout "${INSTALL_TIMEOUT_SEC}" yarn install --frozen-lockfile --network-timeout 600000 \
              || timeout "${INSTALL_TIMEOUT_SEC}" yarn install --ignore-engines --network-timeout 600000 \
              || timeout "${INSTALL_TIMEOUT_SEC}" yarn install --network-timeout 600000
          elif [[ -f package.json ]]; then
            echo "Using npm install (timeout ${INSTALL_TIMEOUT_SEC}s)..."
            npm_install --legacy-peer-deps
          else
            echo "No package.json found, skipping dependency installation"
          fi

      - name: Optional subject build
        if: ${{ steps.row.outputs.run == 'true' }}
        working-directory: subjects/${{ matrix.bug }}
        run: npm run build || echo "No build script or build failed (continuing)"

      - name: Verify mutation target file exists
        if: ${{ steps.row.outputs.run == 'true' }}
        working-directory: subjects/${{ matrix.bug }}
        run: |
          if [[ ! -f "${{ matrix.file }}" ]]; then
            echo "::error::Missing file ${{ matrix.file }}"
            exit 1
          fi
          echo "Target file OK: ${{ matrix.file }} (lines ${{ matrix.lines }})"

      - name: Install custom Stryker into subject (precomputed)
        if: ${{ steps.row.outputs.run == 'true' && inputs.dry_run == false }}
        working-directory: subjects/${{ matrix.bug }}
        run: |
          npm install install-local --no-save
          printf 'legacy-peer-deps=true\n' >> .npmrc
          npx install-local ../../stryker-js/packages/{core,util,api,instrumenter,*-runner}
          npm install @cucumber/cucumber@^10 --no-save

      - name: Five runs — createMutants (OpenRouter) + Stryker usePrecomputed
        if: ${{ steps.row.outputs.run == 'true' && inputs.dry_run == false }}
        working-directory: subjects/${{ matrix.bug }}
        env:
          LLMORPHEUS_LLM_API_ENDPOINT: ${{ secrets.LLMORPHEUS_LLM_API_ENDPOINT }}
          LLMORPHEUS_LLM_AUTH_HEADERS: ${{ secrets.LLMORPHEUS_LLM_AUTH_HEADERS }}
          LLMORPHEUS_LLM_PROVIDER: ${{ secrets.LLMORPHEUS_LLM_PROVIDER }}
        run: |
          set -euo pipefail
          SUBJECT="$(pwd)"
          LLM_ROOT="$GITHUB_WORKSPACE/source/llmorpheus"
          export NODE_OPTIONS=--max-old-space-size=6144

          MODEL="${{ inputs.model }}"
          TEMP="${{ inputs.temperature }}"
          TEMPLATE="${{ inputs.template }}"
          SYSPROMPT="${{ inputs.systemPrompt }}"
          MAXP="${{ inputs.maxNrPrompts }}"
          MAXTOK="${{ inputs.maxTokens }}"
          BENCH="${{ inputs.benchmarkMode }}"
          STROPTS="${{ inputs.strykerOptions }}"
          MFILE="${{ matrix.file }}"

          for run in 1 2 3 4 5; do
            rm -rf "$SUBJECT/MUTATION_TESTING"
            cd "$LLM_ROOT"
            LLMORPHEUS_OPTIONS="--temperature ${TEMP} --maxNrPrompts ${MAXP} --systemPrompt ${SYSPROMPT}.txt --model ${MODEL} --benchmark ${BENCH} --maxTokens ${MAXTOK}"
            (time node benchmark/createMutants.js \
              --path "${SUBJECT}/" \
              --mutate "${MFILE}" \
              --mutateOnlyLines "${{ matrix.lines }}" \
              --template "templates/${TEMPLATE}.hb" \
              --caching false \
              ${LLMORPHEUS_OPTIONS}) 2>&1 | tee -a "$SUBJECT/LLMorpheusOutput_run${run}.txt"

            rm -rf "$SUBJECT/MUTANTS_run${run}"
            mv "$SUBJECT/MUTATION_TESTING" "$SUBJECT/MUTANTS_run${run}"

            cd "$SUBJECT"
            MUTANTS_FILE="$(find "$SUBJECT/MUTANTS_run${run}" -name mutants.json -print -quit || true)"
            if [[ -z "${MUTANTS_FILE}" ]]; then
              echo "::error::mutants.json not found under MUTANTS_run${run}"
              exit 1
            fi
            export MUTANTS_FILE
            echo "MUTANTS_FILE=$MUTANTS_FILE"

            STRYKER_FILES=$(node "$LLM_ROOT/.github/expandGlob.js" "$(pwd)" "${MFILE}" "")
            (time npx stryker run ${STROPTS} --usePrecomputed --mutate ${STRYKER_FILES}) 2>&1 | tee "StrykerOutput_run${run}.txt"
            node "$LLM_ROOT/.github/parseStrykerReport.js" "StrykerOutput_run${run}.txt"
            mv StrykerInfo.json "StrykerInfo_run${run}.json"
          done

      - name: Upload casestudy artifacts
        if: ${{ steps.row.outputs.run == 'true' && inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: casestudy-${{ matrix.bug }}-openrouter
          path: |
            subjects/${{ matrix.bug }}/MUTANTS_run*
            subjects/${{ matrix.bug }}/LLMorpheusOutput_run*.txt
            subjects/${{ matrix.bug }}/StrykerOutput_run*.txt
            subjects/${{ matrix.bug }}/StrykerInfo_run*.json
          if-no-files-found: warn
