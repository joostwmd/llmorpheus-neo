# Casestudy pipeline: LLMorpheus (OpenRouter) + Stryker --usePrecomputed for each thesis bug.
#
# Required repository secrets (read by source/llmorpheus/src/model/Model.ts):
#   LLMORPHEUS_LLM_API_ENDPOINT   e.g. https://openrouter.ai/api/v1/chat/completions
#   LLMORPHEUS_LLM_AUTH_HEADERS   JSON array of { name, value } header objects (Bearer token, etc.)
# Optional:
#   LLMORPHEUS_LLM_PROVIDER       JSON merged into provider-specific request fields when set
#
# workflow_dispatch defaults: temperature 0.0, template template-full, 5 sequential runs (MUTANTS_run1–5),
#   maxNrPrompts 2500 (matches thesis/code/casestudy/*/command.txt style).
# Optional inputs:
#   matrix_filter — substring matched against bug id, repo, or target file path (smoke / subset runs)
#   dry_run       — skip OpenRouter + Stryker; still checks out repos, installs subject deps, verifies target file
#
# Bug list: hardcoded `strategy.matrix.include` below (keep in sync with thesis/code/bugs/bugs-matrix.json and validate-bug-environments.yml).

name: Casestudy LLMorpheus (OpenRouter)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model id (e.g. meta-llama/llama-3.3-70b-instruct)"
        type: string
        required: true
        default: "meta-llama/llama-3.3-70b-instruct"
      temperature:
        description: "Sampling temperature for completions"
        type: number
        default: 0
      template:
        description: "Template base name (templates/<name>.hb under LLMorpheus)"
        type: string
        default: "template-full"
      systemPrompt:
        description: "System prompt file base name (.txt appended by createMutants)"
        type: string
        default: "SystemPrompt-MutationTestingExpert"
      maxNrPrompts:
        description: "Maximum prompts per run"
        type: number
        default: 2500
      maxTokens:
        description: "max_tokens for the LLM request"
        type: number
        default: 250
      benchmarkMode:
        description: "Use benchmark rate limiting in LLMorpheus (see createMutants --benchmark)"
        type: boolean
        default: false
      strykerOptions:
        description: "Extra args for 'stryker run' (e.g. --concurrency 1)"
        type: string
        default: "--concurrency 1"
      matrix_filter:
        description: "If non-empty, only run rows where bug id / repo / row JSON contains this substring"
        type: string
        default: ""
      dry_run:
        description: "If true, skip mutant generation and Stryker (checkout + deps + file check only)"
        type: boolean
        default: false

jobs:
  casestudy:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - bug: "css-loader-663"
